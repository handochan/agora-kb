name: CI

# Repo-wide gate. ubuntu-latest + macos-latest are the required checks; windows-latest runs
# the same chain purely as the objective progress signal for the Windows port epic (#85).
# See issue #100.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow reads the repo and nothing else. No secrets are consumed.
permissions:
  contents: read

# Supersede in-flight runs for the same PR; a new push to a PR invalidates the older run.
# Cancellation is deliberately scoped to pull_request: on a push event `github.head_ref` is empty,
# so every main push shares the group `CI-refs/heads/main` and an unconditional cancel would end
# the previous commit's run as `cancelled`. Main must keep a per-commit conclusion — "the last
# green commit on main" is load-bearing for release/rollback decisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The single platform branch in this whole file: Windows is expected to fail today
    # (unconditional `import fcntl` in curator/claim.py, tracked by #86), so its red must not
    # colour the workflow conclusion. #86 promotes Windows to required by deleting this line.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      # Never let one OS cancel the others: the Windows red is expected and its log is the
      # asset we are after, and ubuntu/macos must still report independently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ADR-0013 is fail-closed: a `network: none` backend refuses to run at all unless a real
      # kernel sandbox is available (linux -> bwrap, darwin -> the built-in sandbox-exec). The
      # macOS runner ships sandbox-exec, but ubuntu-latest does NOT ship bubblewrap, so without
      # this step every curator test that expects a published run gets `no_backend` instead --
      # which is exactly how the first CI run failed while macOS passed. Installing bwrap keeps
      # the Linux leg exercising the REAL confinement path rather than skipping past it.
      # (Operator-facing consequence, documented for beta: a Linux install needs bubblewrap, or
      # the curator fail-closes -- see docs/GETTING-STARTED.md, issue #104.)
      # Installing bwrap is necessary but NOT sufficient on ubuntu-latest: Ubuntu 24.04+ ships
      # kernel.apparmor_restrict_unprivileged_userns=1, so `BwrapIsolation.available()`'s userns
      # probe still fails and selection falls through to the same fail-closed refusal. This is the
      # exact condition `USERNS_REMEDIATION` (curator/isolation/bwrap.py) describes for operators.
      # CI runners are ephemeral and single-tenant, so relaxing the sysctl here is the cheapest of
      # the documented remedies and — unlike skipping the tests — keeps the Linux leg exercising
      # the REAL confinement path. A real Linux deployment should instead install an AppArmor
      # profile granting userns to /usr/bin/bwrap (carried into docs/GETTING-STARTED.md, #104).
      - name: Install bubblewrap + allow unprivileged userns (ADR-0013 kernel sandbox)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Mirrors BwrapIsolation._mount_plan(): a whole-filesystem read-only bind plus a private
          # /proc and /dev. Both halves are load-bearing. Enumerating system dirs instead was bug
          # #113 (a missing /lib64 made exec fail with a misleading ENOENT and turned the probe
          # into a false negative), and a probe that skips the mounts the real run performs was
          # half of #115 (it green-lights a sandbox that then fails at run time -- which on the
          # PASS-2 path used to publish placeholder bodies while reporting success).
          bwrap --version
          if bwrap --unshare-all --die-with-parent \
                   --ro-bind / / --proc /proc --dev /dev -- true; then
            echo "bwrap userns probe: OK"
          else
            echo "bwrap userns probe FAILED — curator would fail closed"
            exit 1
          fi

      # setup-uv publishes NO bare major alias past v7: `refs/tags/v8` and `refs/tags/v9` do not
      # exist (nor as branches), so `@v9` fails the whole job at "Set up job" — before a single
      # step, including the Windows leg whose log is the point of running it at all. Pin the
      # v9.0.0 commit, which is upstream's own documented convention. Never shorten this to `@v9`.
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin uv itself. The `uv lock --check` step below asserts the lockfile would not change,
          # and uv rewrites uv.lock's `revision` when the lock format evolves (this repo is at
          # version = 1, revision = 3). With an unpinned uv, setup-uv installs latest, so such a
          # release would turn an unrelated PR red on BOTH required legs and block every merge.
          # 0.11.19 is the uv that wrote the committed lock; bump it and re-run `uv lock` together.
          version: "0.11.19"
          # pyproject declares requires-python = ">=3.12"; pin the floor so CI proves the
          # oldest supported interpreter rather than whatever the runner image ships.
          python-version: "3.12"
          enable-cache: true

      # `uv sync --frozen` deliberately does NOT validate the lockfile against pyproject.toml
      # (that is `--locked`). Keep drift detection as its own step so a stale uv.lock fails
      # here with a legible message instead of surfacing as a confusing install error.
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      # --all-extras, not --extra dev. `dev` is an entry in [project.optional-dependencies]
      # (there is no [dependency-groups] and no [tool.uv]), so --all-extras is a strict
      # superset of it and additionally installs web/ingest/metrics. Without those, ~108
      # tests across 8 files vanish into module-level `pytest.importorskip` — a green CI that
      # never exercised the web face or the extractors. Install cost is absorbed by the cache.
      - name: Install project with all extras (web, ingest, metrics, dev)
        run: uv sync --frozen --all-extras

      # #115 discriminator, and it MUST run after `uv sync` — the whole point is the uv-managed
      # venv interpreter, whose `.venv/bin/python` reaches the real binary through a
      # minor-version alias symlink (`cpython-3.12-linux-x86_64-gnu` → `cpython-3.12.<z>-...`).
      # Binding realpath-resolved roots left that alias component missing, so bwrap failed at
      # `execvp` and PASS 2 published placeholder bodies while reporting success. The bwrap step
      # above only proves the namespace; this proves the thing that actually broke. Non-fatal: the
      # pytest run below is the gate, this is the breadcrumb that says WHICH half broke.
      - name: Probe that a venv interpreter starts inside the sandbox (#115)
        if: runner.os == 'Linux'
        run: |
          if bwrap --unshare-all --die-with-parent --clearenv \
                   --setenv PATH /usr/bin:/bin \
                   --ro-bind / / --proc /proc --dev /dev --tmpfs /run --tmpfs /tmp \
                   -- "$(uv run python -c 'import sys; print(sys.executable)')" \
                      -c 'import sys, yaml; print("in-sandbox venv python OK", sys.version_info[:2])'; then
            echo "bwrap interpreter probe: OK"
          else
            echo "bwrap interpreter probe FAILED — PASS-2 would author no prose (see #115)"
          fi

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      # -ra prints the skip-reason summary, so the log itself proves the extras are present:
      # a fastapi/trafilatura/pdfminer/markitdown/prometheus_client skip reason must never
      # appear. The only expected reasons are explicit platform conditionals — on ubuntu the
      # two macOS-only seatbelt markers plus "plutil not available (non-macOS)", and on any
      # runner without a local Ollama the two isolation tests that skip rather than guess.
      - name: Test (pytest)
        run: uv run pytest -ra
