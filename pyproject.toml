[project]
name = "agora-kb"
# The version is DERIVED, not declared here (issue #101). SSOT = `src/agora_kb/__init__.py`'s
# `__version__`, read back by `[tool.hatch.version]` below. The direction matters: a dogfooder's
# normal path is `git clone` + `uv run agora` on a source checkout, where the reverse arrangement
# (static version here + `importlib.metadata.version("agora-kb")` at runtime) raises
# `PackageNotFoundError` — the runtime must be able to name itself with no install metadata at all.
dynamic = ["version"]
description = "Self-hostable, OSS, multi-tenant shared memory hub for AI agents (markdown + git + MCP)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "dochan" }]
keywords = ["mcp", "agent-memory", "knowledge-base", "llm-wiki", "markdown", "self-hosted"]

# Core deps kept minimal & permissively licensed. Optional features live in extras so the
# core library stays small and dependency-light (see ADR-0005: fully-OSS BOM).
dependencies = [
    "fastmcp>=2.0",       # MCP server face
    "pyyaml>=6.0",        # config (adapters.yaml), frontmatter
    "pydantic>=2.0",      # data models (inbox item, repo meta, state)
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",     # web + dashboard face
    "uvicorn>=0.30",
    "jinja2>=3.1",        # server-rendered templates (BSD-3) — ADR-0019 §2
    "python-multipart>=0.0.9",  # multipart/form uploads (Apache-2.0)
    "markdown-it-py>=3.0",      # markdown → HTML render (MIT)
]
ingest = [
    "trafilatura>=1.8",   # URL extraction (Apache)
    "pdfminer.six>=2024", # PDF extraction (MIT) — avoid AGPL pymupdf
    # markitdown's docx/xlsx/pptx readers (mammoth, openpyxl, python-pptx) live in its own
    # format extras; the bare package only ships the core dispatcher (all MIT).
    "markitdown[docx,xlsx,pptx]>=0.1",  # docx/xlsx/pptx → markdown (MIT)
]
metrics = [
    "prometheus-client>=0.20",  # dashboard time-series export
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",  # mypy stubs for pyyaml
    "packaging>=22",      # PEP 440 parsing in tests/test_version.py (transitive via pytest; pinned so the version lock cannot silently lose it)
]

[project.scripts]
agora = "agora_kb.cli:main"
agora-ollama-brain = "agora_kb.adapters.ollama_brain:main"
agora-cli-brain = "agora_kb.adapters.cli_agent_brain:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The one place the build learns the version (issue #101). hatchling's regex source reads
# `__version__` straight out of the module, so `uv build` artifact names, the PyPI metadata and the
# string `agora --version` prints can only ever come from the same literal. Moving this path (or
# reintroducing a static `version =` above) re-opens the two-independent-constants hole this issue
# closed — `tests/test_version.py` fails if either happens.
[tool.hatch.version]
path = "src/agora_kb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agora_kb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
