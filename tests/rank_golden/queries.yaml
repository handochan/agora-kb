# The query set the ranking golden is recorded over (Stratum UNIT 3, gate B).
#
# SHAPE: a top-level LIST of entries; each entry is
#
#   id:        stable identifier, referenced by the recorded golden
#   question:  the exact string handed to `Wiki.query` (verbatim, never rewritten)
#   expect:    "ok" | "not_found" — the QueryResult.status this query must produce
#   note:      for a positive, the basename of the expected TOP hit; null for a negative
#   rationale: why this query is in the set — which ranking behaviour it exercises
#
# `expect`/`note` are the INTENT of the query, verified against today's ranker over
# tests/rank_golden/corpus.py at authoring time. They are NOT the golden: per ADR-0012 §0a
# nothing outside core computes lex/struct/fm/score/match_reason, so the fixture RECORDS what
# `Wiki.query` returns (full hit lists, scores, anchors, reasons) and these fields only say what
# the query was written to ask.
#
# Composition: the 4 issue-#146 queries VERBATIM (q146-*), 30 positives (p01–p24, never a verbatim
# note title — 6 Korean, 2 mixed-script — plus the p25–p30 MECHANISM probes, each of which is the
# only query in the set that observes one ranking term), and 10 negatives (n01–n10, 2 Korean) whose
# subject matter is absent from the corpus.
#
# `observed_rank: <N>` is the honest way to record a positive whose expected note is NOT rank 1
# (p27 is the one). The gate asserts that exact rank, so a declared gap stays pinned rather than
# becoming a hole; tuning the corpus until the note came first would tune the fixture to flatter
# the ranker.
#
# Korean queries exercise the #56 CJK bigram tokenizer: `배당금` and the note's `배당` share the
# bigram `배당`, which is the whole reason a Korean question is answerable at all.

# --- the four #146 queries, VERBATIM (do not paraphrase these) -----------------------------------

- id: q146-1
  question: "unbilled receivables"
  expect: ok
  note: unbilled-receivables-recognition
  rationale: >-
    The #146 anchor. Two candidates carry the words: the theme (title weight 3.0) and its finance
    MOC, whose body bullet repeats the theme title at body weight 1.0. Pins that the substantive
    note outranks the map that merely points at it — the ordering half of #146.

- id: q146-2
  question: "investing index funds"
  expect: ok
  note: index-fund-investing
  rationale: >-
    Every token here is also structural furniture — "index" names the root note, "investing" is
    spread over several finance themes — so this pins that lexical concentration in one theme beats
    diffuse corpus-wide token presence.

- id: q146-3
  question: "cooking finance investing"
  expect: ok
  note: cooking-as-a-finance-habit
  rationale: >-
    The cross-domain probe, and the one that exercises the ADR-0012 §4 Stage-1 DOMAIN FOCUS: two
    query tokens are domain names ("cooking", "finance"), and the focus rule seeds only the FIRST
    matching domain's MOC in sorted path order (cooking). The defined best answer is the cooking
    theme that is genuinely about all three words; the cooking MOC is expected right behind it.

- id: q146-4
  question: "finance segment reporting thresholds"
  expect: ok
  note: segment-reporting-thresholds
  rationale: >-
    A query whose distinctive term also titles an H2 ("## Quantitative thresholds"), so it pins the
    §6 heading/linked-theme reason precedence as well as the ordering. Also domain-focused
    ("finance"), so the finance MOC is the seeded root.

# --- positive paraphrases (never a verbatim title) -----------------------------------------------

