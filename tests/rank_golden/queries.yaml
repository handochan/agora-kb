# --- the mechanism probes: one query per ranking term that nothing else pins --------------------
#
# p25–p30 exist because a query set can look thorough and still leave a term unobserved. Each of
# these was chosen by MUTATING the ranker and keeping only the queries that go red — see the
# "Known gaps in the COVERAGE" table in README.md for what each one is the sole evidence of.

- id: p25
  question: "deadlock recovery playbook"
  expect: ok
  note: engineering-moc
  rationale: >-
    The #146 HUSK probe, and the only query that reaches `_passes_gate`'s second branch as the sole
    reason a candidate is admitted. Every word here lives in the engineering MOC's bullet LABEL for
    the husk note, and in NONE of that note's own scoring fields, so the husk arrives at lex=0 and
    `_combined`'s #146 guard is what keeps it out of the results: revert that guard and the husk
    scores 0.35*0.7 = 0.245 > FLOOR and appears as a hit. The MOC itself answers, because the label
    puts the words in the MOC's own body — the thin-page residual #146 explicitly does not close.

- id: p26
  question: "superseded note that collapsed a distinction"
  expect: ok
  note: finance-moc
  rationale: >-
    The ADR-0012 §8 NEGATIVE frontmatter term. The deprecated near-duplicate of the receivables
    note is second here by 0.087 — less than the 0.15 demotion — so removing `deprecated: -0.15`
    puts it FIRST. It is the only query in the set whose top hit is decided by the demotion.

- id: p27
  question: "gilt staircase over two decades"
  expect: ok
  note: bond-ladder-basics
  observed_rank: 2
  rationale: >-
    The ALIAS probe. "gilt"/"staircase" appear in exactly one field of one note — the aliases of
    the ORPHAN `bond-ladder-basics` — so the #56 addendum's title-equivalent weight 3.0 and its
    `FIELD_B['aliases'] = 0` exemption are jointly what lift an orphan (struct 0.175) into second
    place. Cutting the weight to 1.0, removing the b-exemption, or dropping `aliases` from
    `_FIELDS` each move it to rank 4 or out of the results entirely.
    DECLARED GAP (`observed_rank: 2`): the expected note is NOT first. "over two decades" is
    long-horizon vocabulary that `expense-ratio-drag` owns outright, and it wins on lexical
    concentration. Recorded rather than corrected — tuning the corpus until the ladder note came
    first would be tuning the fixture to flatter the ranker.

- id: p28
  question: "the only knife worth sharpening"
  expect: ok
  note: knife-sharpening-angles
  rationale: >-
    The FLOOR probe, UPPER side. Its last hit is the deprecated orphan at 0.205086 — the closest a
    recorded hit gets to FLOOR=0.18 — reached through the single common token "only". Raising the
    floor by 0.05 drops that hit and reddens the golden; before this query the floor could be set
    anywhere in [0.0, 0.504] without changing a byte.

- id: p29
  question: "every quarterly close checklist step"
  expect: ok
  note: quarterly-close-checklist
  rationale: >-
    The FLOOR probe, LOWER side. The same deprecated orphan is admitted by the §6 gate here and
    scores 0.174154 — just UNDER the floor — so it is absent from the record. Lowering the floor by
    0.05 admits it (as rank 14, inside the limit) and reddens the golden. The two probes together
    bracket FLOOR to (0.174, 0.205].

- id: p30
  question: "puppy vaccination schedule"
  expect: ok
  note: sourdough-starter-schedule
  rationale: >-
    Restored after being reworded away during authoring (see n05). The near-miss it was thought to
    record is NOT a floor property: measured, its top hit scores 0.874645, 4.9x FLOOR. What it
    actually pins is that ONE shared common word ("schedule") against an otherwise absent subject
    still answers — the §5 floor is not a topical-relevance test, and p28/p29 are what constrain
    the floor's position.

# --- negatives: the corpus must answer not_found ------------------------------------------------
#
# ADR-0012 §5: honesty when evidence is absent. Each subject is absent from the corpus, so every
# candidate either has lex=0 (dropped by the §6 gate, and since the #146 addendum earning no
# structural term either) or falls under FLOOR=0.18. A negative that starts returning hits means
# the floor or the gate moved.

