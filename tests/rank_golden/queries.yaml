- id: p22
  question: "소비자가 느릴 때 신호를 어디서 만들까"
  expect: ok
  note: backpressure-design-stub
  rationale: >-
    Korean against a STUB (fm=0) whose MOC bullet carries its Korean title and summary — so the MOC
    is a genuine lexical competitor. The query deliberately uses body terms (소비자/신호) the MOC
