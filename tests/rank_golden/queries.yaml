- id: p23
  question: "김치찌개 ratio for broth"
  expect: ok
  note: kimchi-stew-ratio
  rationale: >-
    MIXED SCRIPT. One CJK run and several ASCII runs in one question; pins that the scanner emits
    both token kinds from a single string and that the ASCII half (matching nothing in the Korean
    note) does not drag the hit away.

- id: p24
  question: "배당 dividend 원천징수"
  expect: ok
  note: dividend-tax-korea
  rationale: >-
    MIXED SCRIPT with the ASCII half pointing at a DIFFERENT note (the English dividend theme) than
