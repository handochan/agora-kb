<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agora{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site">
    <span class="brand"><a href="/">Agora</a></span>
    <nav aria-label="Primary">
      <a href="/">Browse</a>
      <a href="/upload">Capture</a>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    Agora — a markdown + git shared-memory hub. Reads are evidence, not synthesis;
    captures become searchable after the next curator run.
  </footer>
</body>
</html>
